<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Безплатни инструменти | Градинарство</title><meta name="description" content="Безплатни малки инструменти за планиране на градината: площ, брой растения и ориентировъчно количество вода."><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><div class="wrap nav"><a class="brand" href="index.html">Градинарство</a><nav><a href="guides.html">Ръководства</a><a href="calendar.html">Календар</a><a href="tools.html">Инструменти</a><a href="about.html">За сайта</a></nav></div></header><main class="wrap"><p class="eyebrow">Безплатни инструменти</p><h1>Планиране на градината</h1><div class="grid two"><section class="card"><h2>Площ на леха</h2><label>Дължина, м<input id="l" type="number" min="0" step="0.1"></label><label>Ширина, м<input id="w" type="number" min="0" step="0.1"></label><button onclick="area()">Изчисли</button><p id="a" class="result"></p></section><section class="card"><h2>Брой растения</h2><label>Дължина на реда, м<input id="r" type="number" min="0" step="0.1"></label><label>Разстояние, м<input id="s" type="number" min="0.01" step="0.01" value="0.4"></label><button onclick="plants()">Изчисли</button><p id="p" class="result"></p></section></div></main><footer class="footer"><div class="wrap">Всички изчисления са ориентировъчни и са предназначени за планиране.</div></footer><script>function area(){const v=(+l.value)*(+w.value);a.textContent=Number.isFinite(v)?v.toFixed(2)+' м²':''}function plants(){const v=Math.floor((+r.value)/(+s.value));p.textContent=Number.isFinite(v)?v+' растения ориентировъчно':''}</script></body></html>
